<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DrishtiSR inference input requirements</title>
  <desc id="desc">Use four Sentinel-2 bands with an ideal 256 by 256 pixel input size and a maximum 512 by 512 pixel input size. The model produces a four-times super-resolved output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#123b55"/></linearGradient>
    <linearGradient id="ideal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25c2a0"/><stop offset="1" stop-color="#37a6ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".26"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" fill="#f4fbff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Inference input requirements</text>
  <text x="60" y="98" fill="#a9cadd" font-family="Arial, Helvetica, sans-serif" font-size="16">Prepare Sentinel-2 imagery within these recommended dimensions before 4× reconstruction.</text>
  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <rect x="60" y="145" width="245" height="150" rx="20" fill="#102a40" stroke="#2b5b78"/>
    <text x="182" y="190" text-anchor="middle" fill="#75dfcb" font-size="18" font-weight="700">REQUIRED CHANNELS</text>
    <text x="182" y="229" text-anchor="middle" fill="#f4fbff" font-size="25" font-weight="700">B02 · B03 · B04 · B08</text>
    <text x="182" y="261" text-anchor="middle" fill="#b7cede" font-size="15">4 Sentinel-2 bands</text>
    <rect x="336" y="145" width="245" height="150" rx="20" fill="url(#ideal)"/>
    <text x="458" y="190" text-anchor="middle" fill="#073047" font-size="18" font-weight="700">IDEAL INPUT SIZE</text>
    <text x="458" y="236" text-anchor="middle" fill="#05263a" font-size="32" font-weight="700">256 × 256 px</text>
    <text x="458" y="265" text-anchor="middle" fill="#073047" font-size="15">Preferred patch size</text>
    <rect x="612" y="145" width="245" height="150" rx="20" fill="#102a40" stroke="#efb860" stroke-width="2"/>
    <text x="734" y="190" text-anchor="middle" fill="#ffd487" font-size="18" font-weight="700">MAXIMUM INPUT SIZE</text>
    <text x="734" y="236" text-anchor="middle" fill="#f4fbff" font-size="32" font-weight="700">512 × 512 px</text>
    <text x="734" y="265" text-anchor="middle" fill="#b7cede" font-size="15">Do not exceed</text>
    <rect x="888" y="145" width="252" height="150" rx="20" fill="#194c47" stroke="#59dfb8"/>
    <text x="1014" y="190" text-anchor="middle" fill="#9df1d7" font-size="18" font-weight="700">MODEL OUTPUT</text>
    <text x="1014" y="236" text-anchor="middle" fill="#f4fbff" font-size="32" font-weight="700">4× scale</text>
    <text x="1014" y="265" text-anchor="middle" fill="#c3e6db" font-size="15">10 m → 2.5 m</text>
  </g>
</svg>
