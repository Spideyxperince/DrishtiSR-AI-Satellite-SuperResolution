<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel2SR architecture</title>
  <desc id="desc">Four Sentinel-2 bands pass through feature extraction, eight residual blocks, two PixelShuffle upsampling stages, residual reconstruction, and four output bands at four-times scale.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09172a"/><stop offset="1" stop-color="#20355f"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".26"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="60" y="67" fill="#f4fbff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Sentinel2SR • 4× reconstruction network</text>
  <text x="60" y="99" fill="#aec4de" font-family="Arial, Helvetica, sans-serif" font-size="16">The checked-in model reconstructs four output bands from four Sentinel-2 input bands.</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="48" y="166" width="174" height="150" rx="18" fill="#0f3044" stroke="#46b7e4"/>
    <text x="135" y="211" fill="#7ce1cb" font-size="18" font-weight="700">INPUT</text><text x="135" y="247" fill="#f4fbff" font-size="19" font-weight="700">B02 • B03</text><text x="135" y="274" fill="#f4fbff" font-size="19" font-weight="700">B04 • B08</text>
    <rect x="273" y="166" width="174" height="150" rx="18" fill="#143850" stroke="#4ba6d2"/>
    <text x="360" y="220" fill="#f4fbff" font-size="18" font-weight="700">FEATURE HEAD</text><text x="360" y="252" fill="#b7cede" font-size="15">3×3 convolution</text><text x="360" y="278" fill="#b7cede" font-size="15">64 features</text>
    <rect x="498" y="150" width="204" height="182" rx="18" fill="url(#model)"/>
    <text x="600" y="206" fill="#fff" font-size="21" font-weight="700">RESIDUAL BODY</text><text x="600" y="241" fill="#f3e8ff" font-size="17">8 residual blocks</text><text x="600" y="271" fill="#f3e8ff" font-size="15">3×3 conv + ReLU</text><text x="600" y="297" fill="#f3e8ff" font-size="15">global feature skip</text>
    <rect x="753" y="166" width="174" height="150" rx="18" fill="#143850" stroke="#4ba6d2"/>
    <text x="840" y="220" fill="#f4fbff" font-size="18" font-weight="700">UPSAMPLING</text><text x="840" y="252" fill="#b7cede" font-size="15">PixelShuffle ×2</text><text x="840" y="278" fill="#b7cede" font-size="15">then ×2</text>
    <rect x="978" y="166" width="174" height="150" rx="18" fill="#1b5b50" stroke="#56d9b2"/>
    <text x="1065" y="211" fill="#b8f4df" font-size="18" font-weight="700">OUTPUT</text><text x="1065" y="247" fill="#f4fbff" font-size="19" font-weight="700">4 bands</text><text x="1065" y="274" fill="#c3e6db" font-size="16">4× scale • 2.5 m</text>
  </g>
  <g fill="none" stroke="#b8ddff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M232 241h30"/><path d="m252 231 10 10-10 10"/><path d="M457 241h30"/><path d="m477 231 10 10-10 10"/><path d="M712 241h30"/><path d="m732 231 10 10-10 10"/><path d="M937 241h30"/><path d="m957 231 10 10-10 10"/></g>
  <text x="600" y="378" text-anchor="middle" fill="#aec4de" font-family="Arial, Helvetica, sans-serif" font-size="15">Learned reconstruction is added to a bilinear 4× baseline before producing the final output.</text>
</svg>
