<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DrishtiSR processing pipeline</title>
  <desc id="desc">Sentinel-2 10 metre input is prepared as paired low and high resolution patches, processed by the Sentinel2SR model with pixel and spectral losses, and reconstructed as a 2.5 metre output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#12334b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25c2a0"/>
      <stop offset="1" stop-color="#37a6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="60" y="68" fill="#e8f5ff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">DrishtiSR • 4× Satellite Super-Resolution Pipeline</text>
  <text x="60" y="100" fill="#9fc4d7" font-family="Arial, Helvetica, sans-serif" font-size="16">from Sentinel-2 imagery at 10 m to a 2.5 m reconstructed product</text>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="170" width="205" height="150" rx="18" fill="#102a40" stroke="#2b5b78"/>
    <text x="162" y="216" text-anchor="middle" fill="#70deca" font-size="30">01</text>
    <text x="162" y="253" text-anchor="middle" fill="#f4fbff" font-size="19" font-weight="700">Sentinel-2 input</text>
    <text x="162" y="280" text-anchor="middle" fill="#b7cede" font-size="15">10 m imagery</text>

    <rect x="335" y="170" width="205" height="150" rx="18" fill="#102a40" stroke="#2b5b78"/>
    <text x="437" y="216" text-anchor="middle" fill="#70deca" font-size="30">02</text>
    <text x="437" y="253" text-anchor="middle" fill="#f4fbff" font-size="19" font-weight="700">Paired patches</text>
    <text x="437" y="280" text-anchor="middle" fill="#b7cede" font-size="15">LR / HR supervision</text>

    <rect x="610" y="170" width="205" height="150" rx="18" fill="#102a40" stroke="#2b5b78"/>
    <text x="712" y="216" text-anchor="middle" fill="#70deca" font-size="30">03</text>
    <text x="712" y="253" text-anchor="middle" fill="#f4fbff" font-size="19" font-weight="700">Sentinel2SR</text>
    <text x="712" y="280" text-anchor="middle" fill="#b7cede" font-size="15">pixel + spectral loss</text>

    <rect x="885" y="170" width="255" height="150" rx="18" fill="url(#accent)"/>
    <text x="1012" y="216" text-anchor="middle" fill="#073047" font-size="30" font-weight="700">04</text>
    <text x="1012" y="253" text-anchor="middle" fill="#05263a" font-size="19" font-weight="700">Super-resolved output</text>
    <text x="1012" y="280" text-anchor="middle" fill="#073047" font-size="15">2.5 m • 4× scale</text>
  </g>

  <g fill="none" stroke="#7fd8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M275 245H315"/><path d="M305 235l10 10-10 10"/>
    <path d="M550 245H590"/><path d="M580 235l10 10-10 10"/>
    <path d="M825 245H865"/><path d="M855 235l10 10-10 10"/>
  </g>
  <text x="600" y="374" text-anchor="middle" fill="#9fc4d7" font-family="Arial, Helvetica, sans-serif" font-size="15">Reported held-out test performance: PSNR 33.607 dB</text>
</svg>
